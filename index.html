<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koinexus Info</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --paper: #ffffff;
        --ink: #18202f;
        --muted: #5f6b7a;
        --line: #dce2ea;
        --accent: #1c6b68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 560px);
        padding: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 16px 40px rgba(24, 32, 47, 0.08);
      }

      h1 {
        margin: 0;
        color: var(--accent);
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 12px 0 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }

      a:focus,
      a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="page-title">
        <h1 id="page-title">Koinexus Info</h1>
        <p>Select the Koinexus page you need.</p>
        <nav aria-label="Koinexus pages">
          <a href="./privacy-policy/">Privacy Policy</a>
          <a href="./email-verification/">Email Verification</a>
        </nav>
      </section>
    </main>
  </body>
</html>
