<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111217" />
    <title>Email Verified | Koinexus</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #05060b;
        --panel: rgba(17, 18, 23, 0.7);
        --border: rgba(255, 255, 255, 0.16);
        --text: #f8fafc;
        --muted: rgba(244, 244, 245, 0.68);
        --violet: #a78bfa;
        --purple: #8b25ff;
        --green: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 8% 4%, rgba(37, 99, 235, 0.55), rgba(37, 99, 235, 0.18) 42%, transparent 72%),
          radial-gradient(circle at 98% 0%, rgba(126, 34, 206, 0.58), rgba(126, 34, 206, 0.22) 48%, transparent 78%),
          linear-gradient(135deg, #173a73 0%, #15172f 42%, #050510 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px 18px;
      }

      .card {
        width: min(100%, 440px);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--panel);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(24px);
      }

      .content {
        display: grid;
        justify-items: center;
        padding: 42px 24px 28px;
        text-align: center;
      }

      .check-ring {
        display: grid;
        width: 136px;
        height: 136px;
        place-items: center;
        border: 1px solid rgba(52, 211, 153, 0.28);
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
      }

      .check-circle {
        display: grid;
        width: 104px;
        height: 104px;
        place-items: center;
        border-radius: 999px;
        background: linear-gradient(135deg, #34d399 0%, #22c55e 100%);
        box-shadow: 0 18px 34px rgba(34, 197, 94, 0.22);
      }

      .check {
        width: 58px;
        height: 58px;
      }

      h1 {
        margin: 30px 0 0;
        font-size: clamp(2.25rem, 9vw, 3rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1.05;
      }

      p {
        max-width: 34ch;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 1.075rem;
        line-height: 1.55;
      }

      .button {
        display: inline-flex;
        width: 100%;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        margin-top: 34px;
        border-radius: 18px;
        background: var(--purple);
        color: #ffffff;
        font-size: 1.075rem;
        font-weight: 900;
        text-decoration: none;
        transition: transform 160ms ease, opacity 160ms ease;
      }

      .button:active {
        opacity: 0.78;
        transform: scale(0.99);
      }

      .brand {
        margin-top: 24px;
        color: rgba(244, 244, 245, 0.52);
        font-size: 0.95rem;
        font-weight: 800;
      }

      .error-state .check-ring {
        border-color: rgba(248, 113, 113, 0.28);
        background: rgba(248, 113, 113, 0.12);
      }

      .error-state .check-circle {
        background: linear-gradient(135deg, #fb7185 0%, #ef4444 100%);
        box-shadow: 0 18px 34px rgba(239, 68, 68, 0.22);
      }

      .error-state .button {
        background: var(--violet);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="status-title">
        <div class="content" id="content">
          <div class="check-ring" aria-hidden="true">
            <div class="check-circle">
              <svg class="check" viewBox="0 0 64 64" fill="none" role="img">
                <path
                  d="M18 33.5 27.3 43 47 21"
                  stroke="white"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>

          <h1 id="status-title">Email verified</h1>
          <p id="status-message">Your Koinexus account is ready. You can return to the app and log in.</p>
          <a class="button" id="open-app" href="koinexusmobile://email-verified">Open Koinexus</a>
          <div class="brand">Koinexus</div>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(`${window.location.search}&${window.location.hash.slice(1)}`);
      const error = params.get("error_description") || params.get("error");

      if (error) {
        document.body.classList.add("error-state");
        document.getElementById("status-title").textContent = "Verification link issue";
        document.getElementById("status-message").textContent =
          "This link could not be verified. Open Koinexus and request a fresh verification email.";
        document.getElementById("open-app").textContent = "Open Koinexus";
      }
    </script>
  </body>
</html>
